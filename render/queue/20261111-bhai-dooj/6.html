<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&display=block" rel="stylesheet"><link href="../../house.css" rel="stylesheet"></head><body class="inv"><i class="r r1"></i><i class="r r2"></i><i class="r r3"></i><i class="r r4"></i><div class="top"><span>Talaash Heritage</span><span>3 / 4</span></div><div class="m"><h1>The story</h1><p>Yamuna kept inviting her brother home for a meal, and on this day he came.</p><p>Yama gave a boon: a brother who eats at his sister’s home on this day is freed from the sufferings of Yamaloka.</p><p class="sm">Source: Yama Dwitiya Vrat Katha, as told on Drik Panchang.</p></div><div class="hl"><i></i><b></b><i></i></div><script>Promise.all([document.fonts.load('80px "Tiro Devanagari Sanskrit"'),document.fonts.load('italic 40px "Tiro Devanagari Sanskrit"')]).then(()=>document.body.classList.add('ready'))</script></body></html>
