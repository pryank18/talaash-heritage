<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&display=block" rel="stylesheet"><link href="../../house.css" rel="stylesheet"></head><body class="inv"><i class="r r1"></i><i class="r r2"></i><i class="r r3"></i><i class="r r4"></i><div class="top"><span>Talaash Heritage</span><span>3 / 4</span></div><div class="m"><h1>He rose from the churned ocean</h1><p>The Bhagavata Purana tells how, when gods and asuras churned the ocean, Dhanvantari came up from it carrying a pot of amrita.</p><p>Its verses call him a knower of Ayurveda.</p><p class="sm">Source: Bhagavata Purana 8.8.</p></div><div class="hl"><i></i><b></b><i></i></div><script>Promise.all([document.fonts.load('80px "Tiro Devanagari Sanskrit"'),document.fonts.load('italic 40px "Tiro Devanagari Sanskrit"')]).then(()=>document.body.classList.add('ready'))</script></body></html>
