# The website sends only the public publishable key, not a user login, and
# Razorpay's webhook sends no key at all. Each function checks what it needs
# itself (Razorpay signatures, database prices), so Supabase's login check is off.

[functions.create-order]
verify_jwt = false

[functions.verify-payment]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false
