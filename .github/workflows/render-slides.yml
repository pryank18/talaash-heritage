# Renders Instagram/Facebook slides (render/queue/<post>/<n>.html) to
# site/media/ig/<post>-<n>.jpg at 1080x1350, then commits them so
# Cloudflare Pages serves them at https://talaash-heritage.pages.dev/media/ig/...
name: Render social slides
on:
  push:
    branches: [main]
    paths: ['render/queue/**', 'tools/render_slides.mjs', '.github/workflows/render-slides.yml']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: render-slides
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Render
        run: node tools/render_slides.mjs
      - name: Commit images
        run: |
          git config user.name "talaash-render-bot"
          git config user.email "talaash-render-bot@users.noreply.github.com"
          git add site/media/ig render/status.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "render: slides $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
