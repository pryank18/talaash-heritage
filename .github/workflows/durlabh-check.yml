# Durlabh Sunday: independent live checks (docs/UNIVERSE.md, section 10).
# Runs on GitHub's servers, so it needs no laptop and no Claude session. A failed run makes
# GitHub email the repository owner, which is the alarm.
#  - every released long read loads with its title, and the index lists it;
#  - a released piece with podcast audio is in podcast.xml and its MP3 is served;
#  - every Durlabh carousel or teaser due within the next 48 hours is "scheduled" in the ledger
#    (the 21:43 queue task sets that when it writes the posting row) and its media files are served.
name: "Durlabh Sunday: live check"
on:
  schedule:
    - cron: "45 6 * * 0"    # Sun 12:15 IST, after the 11:00 release
    - cron: "30 4 * * 1,3"  # Mon and Wed 10:00 IST, the mornings of the teaser and carousel posts
    - cron: "30 4 * * 0,2"  # Sun and Tue 10:00 IST, a day ahead of them
  workflow_dispatch:
    inputs:
      urls:
        description: "Extra addresses to check (space-separated, relative to the site)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check pages, ledger and media
        env:
          EXTRA: ${{ github.event.inputs.urls }}
        run: |
          python3 - <<'PY'
          import datetime, glob, json, re, sys, urllib.request
          BASE = "https://talaash-heritage.pages.dev/"
          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now = datetime.datetime.now(IST)
          problems, ok = [], []
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (talaash-durlabh-check)"})
              for _ in range(3):
                  try:
                      r = urllib.request.urlopen(req, timeout=30)
                      return r.status, r.read()
                  except urllib.error.HTTPError as e:
                      code = e.code
                  except Exception as e:
                      code = str(e)
              return code, b""
          st, idx = get(BASE + "durlabh")
          if st != 200:
              problems.append(f"index /durlabh returned {st}")
          idx = idx.decode("utf-8", "ignore")
          for f in sorted(glob.glob("content/durlabh/*.json")):
              d = json.load(open(f, encoding="utf-8"))
              rel = datetime.datetime.fromisoformat(d["release"])
              if d.get("hold") or rel > now:
                  continue
              st, body = get(BASE + d["page"])
              title = d["title"].split(":")[0].strip()
              if st != 200:
                  problems.append(f"{d['page']} returned {st}")
              elif title.encode() not in body:
                  problems.append(f"{d['page']} is up but its title '{title}' is missing")
              else:
                  ok.append(d["page"])
              if d["page"] not in idx:
                  problems.append(f"/durlabh does not list {d['page']}")
              if d.get("audio"):
                  st, feed = get(BASE + "podcast.xml")
                  if st != 200 or d["page"].encode() not in feed:
                      problems.append(f"podcast.xml ({st}) does not list {d['page']}")
                  st, _ = get(BASE + d["audio"]["file"])
                  if st != 200:
                      problems.append(f"podcast audio {d['audio']['file']} returned {st}")
          u = json.load(open("content/universe.json", encoding="utf-8"))
          for it in u["items"]:
              if not it["id"].startswith("tl-durlabh-") or not it.get("slot"):
                  continue
              slot = datetime.datetime.fromisoformat(it["slot"]).replace(tzinfo=IST)
              if not (now <= slot + datetime.timedelta(hours=3) and slot - now <= datetime.timedelta(hours=48)):
                  continue
              if it["status"] not in ("scheduled", "live"):
                  problems.append(f"{it['id']} (slot {it['slot']}) is '{it['status']}', not queued yet")
              m = re.search(r"site/media/ig/([\w\-]+)-1\.jpg", it.get("notes", ""))
              if m:
                  n = 1
                  while True:
                      st, _ = get(f"{BASE}media/ig/{m.group(1)}-{n}.jpg")
                      if st != 200:
                          break
                      n += 1
                  if n == 1:
                      problems.append(f"{it['id']}: slides {m.group(1)}-*.jpg are not served")
                  else:
                      ok.append(f"{it['id']}: {n-1} slides served")
          import os
          for path in (os.environ.get("EXTRA") or "").split():
              st, body = get(BASE + path)
              (ok if st == 200 else problems).append(f"{path}: {st}, {len(body)} bytes")
          print("OK:", *ok, sep="\n  ") if ok else print("OK: nothing due")
          if problems:
              print("PROBLEMS:", *problems, sep="\n  ")
              sys.exit(1)
          PY
